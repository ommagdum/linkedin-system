spring:
  application:
    name: feed-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: feed-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.serialization.StringDerializer
      value-deserializer: org.springframework.kafka.suppor.serializer.JsonDerializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap

server:
  port: 8083

user:
  service:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
